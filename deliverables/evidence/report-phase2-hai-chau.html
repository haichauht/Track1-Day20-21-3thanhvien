mposition", "quote": "The decomposition typically produces three layers, each with its own evaluation strategy: 1. Orchestration and routing — did the system understand the request and choose the right path? 2. Individual skills — did each component do its job? 3. Full-path outcomes — did the user's goal get accomplished?"}, {"doc_id": "ai-evals-m06", "section_id": "common-categories-for-code-based-evals", "quote": "Search quality problems surface in RAG and GREP-based systems. If the right documents weren't retrieved, the generation step never had a chance."}], "followup_questions": ["Bạn có thể giải thích thêm về cách đánh giá từng lớp trong hệ thống RAG không?", "Làm thế nào để cải thiện retrieval quality trong một hệ thống RAG?", "Có những phương pháp nào để đo lường answer quality một cách hiệu quả?"]}, "error": null, "raw_content": "{\n  \"scope\": \"in_scope\",\n  \"answer\": \"Một hệ thống RAG nên được đánh giá ở ba lớp: (1) **Orchestration and routing** — kiểm tra xem hệ thống có hiểu yêu cầu và chọn đúng đường đi không; (2) **Individual skills** — đánh giá từng thành phần có thực hiện đúng nhiệm vụ của nó không; (3) **Full-path outcomes** — xem xét liệu mục tiêu của người dùng có được hoàn thành hay không. Việc phân biệt giữa retrieval quality và answer quality rất quan trọng: retrieval quality liên quan đến việc liệu các tài liệu đúng có được truy xuất hay không, trong khi answer quality đánh giá tính chính xác và hữu ích của câu trả lời cuối cùng.\",\n  \"sources\": [\n    {\n      \"doc_id\": \"ai-evals-m12\",\n      \"section_id\": \"architectural-decomposition\",\n      \"quote\": \"The decomposition typically produces three layers, each with its own evaluation strategy: 1. Orchestration and routing — did the system understand the request and choose the right path? 2. Individual skills — did each component do its job? 3. Full-path outcomes — did the user's goal get accomplished?\"\n    },\n    {\n      \"doc_id\": \"ai-evals-m06\",\n      \"section_id  DATA TỪ ĐÂU: 1 Dog-fooding — data tự nhiên; 2 Thumbs-down — signal từ user."}, {"doc_id": "slide-day19-20", "section_id": "s11", "quote": "BA NGUYÊN TẮC KHI DÙNG DATA: Bắt đầu nhỏ: 10 samples, không phải 1000; Quality quan trọng hơn quantity; Data flywheel tích lũy theo thời gian."}], "followup_questions": ["Tại sao việc bắt đầu với một dataset nhỏ lại quan trọng trong quá trình eval?", "Làm thế nào để đảm bảo chất lượng của dataset trong quá trình thu thập dữ liệu?", "Có những phương pháp nào khác để thu thập dữ liệu cho eval ngoài dog-fooding và thumbs-down?"]}, "error": null, "raw_content": "{\n  \"scope\": \"in_scope\",\n  \"answer\": \"Dataset eval ban đầu nên lấy dữ liệu từ các nguồn tự nhiên như dog-fooding (sử dụng sản phẩm của chính mình) và từ phản hồi của người dùng (thumbs-down). Ba nguyên tắc quan trọng khi sử dụng dữ liệu là: 1) Bắt đầu nhỏ với số lượng mẫu ít nhưng chất lượng cao; 2) Chất lượng quan trọng hơn số lượng; 3) Dữ liệu cần được tích lũy theo thời gian để cải thiện độ chính xác của evals.\",\n  \"sources\": [\n    {\n      \"doc_id\": \"slide-day19-20\",\n      \"section_id\": \"s11\",\n      \"quote\": \"LẤY DATA TỪ ĐÂU: 1 Dog-fooding — data tự nhiên; 2 Thumbs-down — signal từ user.\"\n    },\n    {\n      \"doc_id\": \"slide-day19-20\",\n      \"section_id\": \"s11\",\n      \"quote\": \"BA NGUYÊN TẮC KHI DÙNG DATA: Bắt đầu nhỏ: 10 samples, không phải 1000; Quality quan trọng hơn quantity; Data flywheel tích lũy theo thời gian.\"\n    }\n  ],\n  \"followup_questions\": [\n    \"Tại sao việc bắt đầu với một dataset nhỏ lại quan trọng trong quá trình eval?\",\n    \"Làm thế nào để đảm bảo chất lượng của dataset trong quá trình thu thập dữ liệu?\",\n    \"Có những phương pháp nào khác để thu thập dữ liệu cho eval ngoài dog-fooding và thumbs-down?\"\n  ]\n}", "latency_s": 6.11, "cost_usd": 0.00185595, "verdict": null, "rationale": "", "show_judge": false, "human_label": "", "human_note": ""}, {"scenario_id": "sc-14-monitoring-drift", "input": "Sau khi ship, tôi nên sample trace và theo dõi tín hiệu drift nào để biết offline eval không còn đại diện production?", "slide": null, "expected_scope": "in_scope", "metadata": {"persona": "PM ôn lại", "intent": "lập kế hoạch monitoring", "risk": "high", "source_type": "synthetic-reviewed", "slide": null}, "output": {"scope": "in_scope", "answer": "Sau khi ship, bạn nên theo dõi các tín hiệu drift để đảm bảo rằng offline eval vẫn đại diện cho production. Các tín hiệu quan trọng bao gồm: 1) **Divergence score**: Nếu tỷ lệ pass offline là 90% nhưng online chỉ 72%, điều này cho thấy dataset tham chiếu không còn phù hợp. 2) **New failure modes**: Nếu online traces phát hiện các mẫu lỗi mới không có trong dataset tham chiếu, bạn cần cập nhật evals. 3) **User feedback contradiction**: Nếu điểm số eval cao nhưng tỷ lệ phản hồi tiêu cực từ người dùng tăng, bạn đang đo lường sai điều gì đó.", "sources": [{"doc_id": "ai-evals-m11", "section_id": "the-three-drift-signals", "quote": "Offline pass rate is 90%, but online pass rate on the same evals is 72%. The gap means your reference dataset doesn't represent production."}, {"doc_id": "ai-evals-m11", "section_id": "key-takeaways-and-definitions", "quote": "Detect drift early. When offline and online scores diverge, your dataset needs refreshing."}], "followup_questions": ["Bạn có thể mô tả cách thức thực hiện online monitoring trong một dự án cụ thể không?", "Làm thế nào để cập nhật dataset tham chiếu khi phát hiện drift?", "Có những phương pháp nào khác để đánh giá chất lượng sản phẩm sau khi ship?"]}, "error": null, "raw_content": "{\n  \"scope\": \"in_scope\",\n  \"answer\": \"Sau khi ship, bạn nên theo dõi các tín hiệu drift để đảm bảo rằng offline eval vẫn đại diện cho production. Các tín hiệu quan trọng bao gồm: 1) **Divergence score**: Nếu tỷ lệ pass offline là 90% nhưng online chỉ 72%, điều này cho thấy dataset tham chiếu không còn phù hợp. 2) **New failure modes**: Nếu online traces phát hiện các mẫu lỗi mới không có
